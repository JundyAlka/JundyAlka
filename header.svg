<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" fill="none" role="img" aria-label="Ahmad Jundy Alkrathoni - Fullstack Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f2438" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="250" rx="14" fill="#050b14"/>
  <rect x="0" y="0" width="800" height="250" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="800" height="250" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="799" height="249" rx="13.5" fill="none" stroke="#173a56" stroke-width="1"/>
  <rect x="120" y="0" width="560" height="1.5" fill="url(#topLine)"/>

  <!-- corner brackets -->
  <g stroke="#38bdf8" stroke-width="1.2" fill="none" opacity="0.75">
    <path d="M20 42V26a6 6 0 0 1 6-6h16"/>
    <path d="M780 42V26a6 6 0 0 0-6-6h-16"/>
    <path d="M20 208v16a6 6 0 0 0 6 6h16"/>
    <path d="M780 208v16a6 6 0 0 1-6 6h-16"/>
  </g>

  <text x="400" y="94" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="46" font-weight="bold" fill="url(#nameGrad)" letter-spacing="0.5">Ahmad Jundy Alkrathoni</text>

  <line x1="250" y1="110" x2="550" y2="110" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1"/>

  <text x="400" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#bae6fd">Building Practical Web Systems &amp; AI-Assisted Tools</text>

  <g>
    <rect x="212.5" y="160.5" width="177" height="33" rx="6" fill="#081726" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <text x="301" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7dd3fc">{} Fullstack Developer</text>

    <rect x="404.5" y="160.5" width="183" height="33" rx="6" fill="#081726" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1"/>
    <text x="496" y="182" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#7dd3fc">Jawa Tengah, Indonesia</text>
  </g>

  <text x="400" y="219" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#4a6b87" letter-spacing="0.6">Informatics Engineering &#183; Universitas Muhammadiyah Purworejo</text>
</svg>
