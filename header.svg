<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" fill="none" role="img" aria-label="Ahmad Jundy Alkrathoni - Fullstack Web Developer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020c09" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0d2a20" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="250" rx="16" fill="#020c09"/>
  <rect x="0" y="0" width="800" height="250" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="800" height="250" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="798.5" height="248.5" rx="15.25" fill="none" stroke="#134e3a" stroke-width="1.5"/>

  <text x="400" y="92" text-anchor="middle" font-family="Trebuchet MS, Verdana, Arial, sans-serif" font-size="48" font-weight="bold" fill="url(#nameGrad)">Ahmad Jundy Alkrathoni</text>

  <text x="400" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#a7f3d0">Building Practical Web Systems &amp; AI-Assisted Tools</text>

  <g>
    <rect x="212" y="158" width="178" height="34" rx="8" fill="#04150f" stroke="#10b981" stroke-width="1.2"/>
    <text x="301" y="180" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6ee7b7">{} Fullstack Developer</text>

    <rect x="404" y="158" width="184" height="34" rx="8" fill="#04150f" stroke="#10b981" stroke-width="1.2"/>
    <text x="496" y="180" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#6ee7b7">Jawa Tengah, Indonesia</text>
  </g>

  <text x="400" y="218" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#3f7f68">Informatics Engineering &#183; Universitas Muhammadiyah Purworejo</text>
