<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none" role="img" aria-label="developer.js terminal card">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0f2438" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="800" height="420" rx="14" fill="#050b14"/>
  <rect x="0" y="0" width="800" height="420" rx="14" fill="url(#grid2)"/>
  <rect x="0.5" y="0.5" width="799" height="419" rx="13.5" fill="none" stroke="#173a56" stroke-width="1"/>

  <rect x="24.5" y="24.5" width="751" height="371" rx="10" fill="url(#termBg)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>

  <!-- title bar -->
  <path d="M25 34a10 10 0 0 1 10-10h730a10 10 0 0 1 10 10v24H25z" fill="#0a1c2e"/>
  <line x1="25" y1="58" x2="775" y2="58" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="48" cy="41" r="5" fill="none" stroke="#f87171" stroke-width="1.2"/>
  <circle cx="68" cy="41" r="5" fill="none" stroke="#fbbf24" stroke-width="1.2"/>
  <circle cx="88" cy="41" r="5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="400" y="46" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7dd3fc" letter-spacing="2.5">developer.js</text>
  <circle cx="714" cy="41" r="3.5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="728" y="45" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4a6b87">status</text>

  <!-- scanline sweep -->
  <rect x="25" y="58" width="750" height="1.2" fill="url(#scan)">
    <animate attributeName="y" values="60;352;60" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- gutter -->
  <line x1="70" y1="58" x2="70" y2="361" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#3d5f7d" text-anchor="end">
    <text x="58" y="92">1</text>
    <text x="58" y="118">2</text>
    <text x="58" y="144">3</text>
    <text x="58" y="170">4</text>
    <text x="58" y="196">5</text>
    <text x="58" y="222">6</text>
    <text x="58" y="248">7</text>
    <text x="58" y="274">8</text>
    <text x="58" y="300">9</text>
    <text x="58" y="326">10</text>
  </g>

  <!-- code -->
  <g font-family="Consolas, Menlo, monospace" font-size="13.5">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.1s" fill="freeze"/>
      <text x="88" y="92" fill="#c084fc">const <tspan fill="#e2e8f0">developer = {</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.4s" fill="freeze"/>
      <text x="112" y="118" fill="#38bdf8">name<tspan fill="#64748b">: </tspan><tspan fill="#7dd3fc">"Ahmad Jundy Alkrathoni"</tspan><tspan fill="#64748b">,</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.7s" fill="freeze"/>
      <text x="112" y="144" fill="#38bdf8">role<tspan fill="#64748b">: </tspan><tspan fill="#7dd3fc">"Fullstack Web &amp; Mobile Developer"</tspan><tspan fill="#64748b">,</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.0s" fill="freeze"/>
      <text x="112" y="170" fill="#38bdf8">stack<tspan fill="#64748b">: [</tspan><tspan fill="#7dd3fc">"TypeScript"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#7dd3fc">"React"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#7dd3fc">"Flutter"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#7dd3fc">"PHP"</tspan><tspan fill="#64748b">],</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.3s" fill="freeze"/>
      <text x="112" y="196" fill="#38bdf8">principle<tspan fill="#64748b">: </tspan><tspan fill="#7dd3fc">"Simple systems that people actually use."</tspan><tspan fill="#64748b">,</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.6s" fill="freeze"/>
      <text x="112" y="222" fill="#38bdf8">focus<tspan fill="#64748b">: </tspan><tspan fill="#7dd3fc">"POS, inventory &amp; AI-assisted tools"</tspan><tspan fill="#64748b">,</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.9s" fill="freeze"/>
      <text x="112" y="248" fill="#38bdf8">build<tspan fill="#64748b">: () =&gt; {</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.2s" fill="freeze"/>
      <text x="136" y="274" fill="#c084fc">return <tspan fill="#7dd3fc">"real solutions for real businesses"</tspan><tspan fill="#64748b">;</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.5s" fill="freeze"/>
      <text x="112" y="300" fill="#64748b">}</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.8s" fill="freeze"/>
      <text x="88" y="326" fill="#e2e8f0">}</text>
      <rect x="100" y="314" width="7" height="16" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- status bar -->
  <path d="M25 361h750v24a10 10 0 0 1-10 10H35a10 10 0 0 1-10-10z" fill="#0a1c2e"/>
  <line x1="25" y1="361" x2="775" y2="361" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="48" y="381" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#7dd3fc">main<tspan fill="#3d5f7d">  Ln 10, Col 2</tspan></text>
  <circle cx="664" cy="377" r="3.2" fill="#38bdf8"/>
  <text x="676" y="381" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#7dd3fc">Live</text>
  <text x="714" y="381" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#3d5f7d">JavaScript</text>
</svg>
